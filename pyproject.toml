[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-connector-core"
version = "0.2.2.dev0"
description = "Shared native harness runtime contracts for Okto Nexus"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Okto Labs"}]
license = "Elastic-2.0"
license-files = ["LICENSE"]
dependencies = ["rfc8785==0.1.4", "jsonschema==4.26.0"]

[project.optional-dependencies]
test = ["pytest>=8", "build>=1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexus_connector_core = ["py.typed", "contracts/nxl/v1/*.json", "native/*.schemas.json", "pi_extension/*.js", "pi_extension/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
