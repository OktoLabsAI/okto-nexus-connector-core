name: Core CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ['3.11', '3.12', '3.13']
        include:
          - os: macos-26-intel
            python-version: '3.13'
    steps:
      - name: Check out Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test and build dependencies
        run: python -m pip install ".[test]"
      - name: Verify generated contract bundle
        run: python contracts/generate.py --check
      - name: Verify generated R4 contract bundle
        run: python contracts/generate_r4.py --check
      - name: Test Core and copied adapter regressions
        run: python -m pytest -q
      - name: Build independent wheel and sdist
        run: python tools/build_artifacts.py
      - name: Prepare dependency wheelhouse
        run: >-
          python -m pip download --only-binary=:all: --dest build/offline-wheelhouse
          'setuptools>=68' wheel 'rfc8785==0.1.4' 'jsonschema==4.26.0'
      - name: Verify offline wheel and sdist installation
        run: python tools/verify_offline_artifacts.py --wheelhouse build/offline-wheelhouse
      - name: Verify clean-wheel imports and resources
        run: python tools/verify_wheel.py
      - name: Verify native Intel macOS ownership from an installed venv
        if: runner.os == 'macOS'
        run: |
          python -c "import platform; assert platform.machine() == 'x86_64'"
          python -m venv build/macos-venv
          build/macos-venv/bin/python -m pip install dist/*.whl
          build/macos-venv/bin/python -I tools/macos_native_acceptance.py --runs 10 --output build/macos-native-acceptance.json
      - name: Retain native macOS acceptance evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-intel-native-acceptance
          path: build/macos-native-acceptance.json
          if-no-files-found: warn

  sbom:
    name: Runtime dependency SBOM
    needs: test-and-package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install build frontend
        run: python -m pip install 'build>=1'
      - name: Build independent wheel and sdist
        run: python tools/build_artifacts.py
      - name: Inventory installed wheel and runtime dependencies
        run: python tools/generate_sbom.py
      - name: Preserve development artifacts for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-development-artifacts
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sbom.cdx.json
          if-no-files-found: error
          retention-days: 7
